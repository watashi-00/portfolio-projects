<svg viewBox="0 0 540 260" class="w-full h-full" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid-dots-cms" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.5" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  <rect width="540" height="260" fill="#020202"/>
  <rect width="540" height="260" fill="url(#grid-dots-cms)"/>

  {/* Frame & Corner Accents */}
  <rect x="20" y="20" width="500" height="220" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <path d="M 20 30 L 20 20 L 30 20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 520 30 L 520 20 L 510 20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 20 230 L 20 240 L 30 240" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 520 230 L 520 240 L 510 240" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  {/* GITHUB REPO DATA SOURCE (LEFT) */}
  <g>
    <rect x="45" y="55" width="105" height="140" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="97.5" y="78" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="7.5" font-family="JetBrains Mono, monospace">GITHUB REPO CMS</text>
    <text x="97.5" y="89" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="6" font-family="JetBrains Mono, monospace">watashi-00/portfolio-projects</text>

    <line x1="55" y1="102" x2="140" y2="102" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <text x="60" y="116" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">index.json</text>
    <text x="60" y="132" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">projects/*.json</text>
    <text x="60" y="148" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">svg/*.svg</text>
    <text x="60" y="164" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">hero / about / contact</text>
  </g>

  {/* CONNECTOR REPO -> CDN */}
  <path d="M 150 125 L 205 125" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" stroke-dasharray="3,3"/>

  {/* GITHUB RAW CDN (CENTER) */}
  <rect x="205" y="55" width="150" height="140" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="280" y="80" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9" font-family="JetBrains Mono, monospace" font-weight="bold" letter-spacing="1">GITHUB RAW CDN</text>
  <text x="280" y="93" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">raw.githubusercontent.com</text>

  <g><line x1="220" y1="115" x2="340" y2="115" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="115" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="118" fill="rgba(255,255,255,0.35)" font-size="6.5" font-family="JetBrains Mono, monospace">Zero-Latency JSON Edge</text></g>
  <g><line x1="220" y1="135" x2="340" y2="135" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="135" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="138" fill="rgba(255,255,255,0.35)" font-size="6.5" font-family="JetBrains Mono, monospace">CacheBuster (?t=timestamp)</text></g>
  <g><line x1="220" y1="155" x2="340" y2="155" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="155" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="158" fill="rgba(255,255,255,0.35)" font-size="6.5" font-family="JetBrains Mono, monospace">Raw Unescaped SVG Text</text></g>

  {/* CONNECTOR CDN -> CLIENT */}
  <path d="M 355 125 L 395 125" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" stroke-dasharray="3,3"/>

  {/* REACT CLIENT SPA (RIGHT) */}
  <g>
    <rect x="395" y="55" width="105" height="140" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="447.5" y="78" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="7.5" font-family="JetBrains Mono, monospace">REACT 19 SPA</text>
    <text x="447.5" y="89" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="6" font-family="JetBrains Mono, monospace">Vite + Tailwind v4</text>

    <line x1="405" y1="102" x2="490" y2="102" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <text x="410" y="116" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">portfolioDataService</text>
    <text x="410" y="132" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">localStorage Cache</text>
    <text x="410" y="148" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">Dynamic SVG Render</text>
    <text x="410" y="164" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">Zero-Rebuild Updates</text>
  </g>

  <text x="270" y="222" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="7" font-family="JetBrains Mono, monospace" letter-spacing="2">// SERVERLESS GIT-AS-A-CMS FRONTEND ARCHITECTURE</text>
</svg>
