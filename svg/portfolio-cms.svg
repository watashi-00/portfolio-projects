<svg viewBox="0 0 540 260" class="w-full h-full" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid-cms-clean" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.4"/>
    </pattern>
  </defs>

  {/* Background Grid */}
  <rect width="540" height="260" fill="url(#grid-cms-clean)"/>

  {/* Outer Frame */}
  <rect x="15" y="15" width="510" height="230" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  {/* Corner Accents */}
  <g><line x1="11" y1="15" x2="19" y2="15" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/><line x1="15" y1="11" x2="15" y2="19" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/></g>
  <g><line x1="521" y1="15" x2="529" y2="15" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/><line x1="525" y1="11" x2="525" y2="19" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/></g>
  <g><line x1="11" y1="245" x2="19" y2="245" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/><line x1="15" y1="241" x2="15" y2="249" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/></g>
  <g><line x1="521" y1="245" x2="529" y2="245" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/><line x1="525" y1="241" x2="525" y2="249" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/></g>

  {/* GITHUB REPO DATA SOURCE (LEFT) */}
  <g>
    <rect x="35" y="55" width="115" height="140" rx="3" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.18)" stroke-width="0.7"/>
    <text x="92.5" y="78" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8.5" font-family="JetBrains Mono, monospace">GITHUB REPO CMS</text>
    <text x="92.5" y="89" text-anchor="middle" fill="rgba(255,255,255,0.18)" font-size="6" font-family="JetBrains Mono, monospace">watashi-00/portfolio-projects</text>

    <line x1="45" y1="102" x2="140" y2="102" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <text x="50" y="116" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">📄 index.json</text>
    <text x="50" y="132" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">📁 projects/*.json</text>
    <text x="50" y="148" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">📁 svg/*.svg</text>
    <text x="50" y="164" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">📄 hero/about/contact</text>
  </g>

  {/* CONNECTOR REPO -> CDN */}
  <path d="M 150 125 L 195 125" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.7" stroke-dasharray="3,3"/>

  {/* GITHUB RAW CDN (CENTER) */}
  <rect x="195" y="55" width="150" height="140" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.25)" stroke-width="0.9"/>
  <text x="270" y="80" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="9.5" font-family="JetBrains Mono, monospace">GITHUB RAW CDN</text>
  <text x="270" y="93" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="7" font-family="JetBrains Mono, monospace">raw.githubusercontent.com</text>

  {/* CDN Internal Channels */}
  <g><line x1="210" y1="112" x2="330" y2="112" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="222" cy="112" r="2" fill="rgba(255,255,255,0.3)"/><text x="232" y="115" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">Zero-Latency JSON Edge</text></g>
  <g><line x1="210" y1="132" x2="330" y2="132" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="222" cy="132" r="2" fill="rgba(255,255,255,0.3)"/><text x="232" y="135" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">CacheBuster (?t=timestamp)</text></g>
  <g><line x1="210" y1="152" x2="330" y2="152" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="222" cy="152" r="2" fill="rgba(255,255,255,0.3)"/><text x="232" y="155" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">Raw Unescaped SVG Text</text></g>

  {/* CONNECTOR CDN -> CLIENT */}
  <path d="M 345 125 L 395 125" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.7" stroke-dasharray="3,3"/>

  {/* REACT CLIENT SPA (RIGHT) */}
  <g>
    <rect x="395" y="55" width="110" height="140" rx="3" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.18)" stroke-width="0.7"/>
    <text x="450" y="78" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="8.5" font-family="JetBrains Mono, monospace">REACT 19 SPA</text>
    <text x="450" y="89" text-anchor="middle" fill="rgba(255,255,255,0.18)" font-size="6" font-family="JetBrains Mono, monospace">Vite + Tailwind v4</text>

    <line x1="405" y1="102" x2="495" y2="102" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <text x="410" y="116" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">⚡ portfolioDataService</text>
    <text x="410" y="132" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">💾 localStorage Cache</text>
    <text x="410" y="148" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">🎨 Dynamic SVG Render</text>
    <text x="410" y="164" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">🚀 Zero-Rebuild Updates</text>
  </g>

  {/* FOOTER DASHED BUS */}
  <line x1="45" y1="225" x2="495" y2="225" stroke="rgba(255,255,255,0.12)" stroke-width="0.6" stroke-dasharray="4,4"/>
  <text x="270" y="237" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="7.5" font-family="JetBrains Mono, monospace">SERVERLESS GIT-AS-A-CMS FRONTEND ARCHITECTURE</text>
</svg>
