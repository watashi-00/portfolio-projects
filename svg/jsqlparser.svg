<svg viewBox="0 0 540 260" class="w-full h-full" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid-dots-jsql" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.5" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  <rect width="540" height="260" fill="#020202"/>
  <rect width="540" height="260" fill="url(#grid-dots-jsql)"/>

  <!-- Frame & Corner Accents -->
  <rect x="20" y="20" width="500" height="220" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <path d="M 20 30 L 20 20 L 30 20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 520 30 L 520 20 L 510 20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 20 230 L 20 240 L 30 240" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 520 230 L 520 240 L 510 240" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- INPUT SQL STATEMENT (LEFT) -->
  <g>
    <rect x="45" y="60" width="110" height="40" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="100" y="80" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="7" font-family="JetBrains Mono, monospace">CLICKHOUSE SQL</text>
    <text x="100" y="90" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="6" font-family="JetBrains Mono, monospace">[LEFT] ARRAY JOIN</text>
  </g>
  <g>
    <rect x="45" y="150" width="110" height="40" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="100" y="173" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="7.5" font-family="JetBrains Mono, monospace">JAVACC GRAMMAR</text>
  </g>

  <!-- CONNECTORS LEFT -> CENTER -->
  <path d="M 155 80 L 205 130" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <path d="M 155 170 L 205 130" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>

  <!-- JSQLPARSER CORE (CENTER) -->
  <rect x="205" y="55" width="150" height="150" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="280" y="78" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9" font-family="JetBrains Mono, monospace" font-weight="bold" letter-spacing="1">JSQLPARSER ENGINE</text>
  <text x="280" y="91" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">ClickHouse AST Extension</text>

  <g><line x1="220" y1="110" x2="340" y2="110" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="110" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="113" fill="rgba(255,255,255,0.4)" font-size="6.5" font-family="JetBrains Mono, monospace">JSqlParserCC.jjt Token</text></g>
  <g><line x1="220" y1="130" x2="340" y2="130" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="130" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="133" fill="rgba(255,255,255,0.4)" font-size="6.5" font-family="JetBrains Mono, monospace">AST Join.isArray() Node</text></g>
  <g><line x1="220" y1="150" x2="340" y2="150" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="150" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="153" fill="rgba(255,255,255,0.4)" font-size="6.5" font-family="JetBrains Mono, monospace">SelectTest.java Verification</text></g>
  <g><line x1="220" y1="170" x2="340" y2="170" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="170" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="173" fill="rgba(255,255,255,0.4)" font-size="6.5" font-family="JetBrains Mono, monospace">Deparser &amp; AST Visitor</text></g>

  <!-- CONNECTORS CENTER -> RIGHT -->
  <path d="M 355 130 L 395 80" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <path d="M 355 130 L 395 170" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>

  <!-- OUTPUTS (RIGHT) -->
  <g>
    <rect x="395" y="60" width="105" height="40" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="447.5" y="83" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="7.5" font-family="JetBrains Mono, monospace">PARSED AST TREE</text>
  </g>
  <g>
    <rect x="395" y="150" width="105" height="40" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="447.5" y="83" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="7.5" font-family="JetBrains Mono, monospace">SQL DEPARSER OUTPUT</text>
  </g>

  <text x="270" y="222" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="7" font-family="JetBrains Mono, monospace" letter-spacing="2">// JSQLPARSER CLICKHOUSE ARRAY JOIN PARSER CONTRIBUTION</text>
</svg>
