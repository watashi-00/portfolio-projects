<svg viewBox="0 0 540 260" class="w-full h-full" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid-dots-overlay" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.5" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  <rect width="540" height="260" fill="#020202"/>
  <rect width="540" height="260" fill="url(#grid-dots-overlay)"/>

  {/* Frame & Corner Accents */}
  <rect x="20" y="20" width="500" height="220" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <path d="M 20 30 L 20 20 L 30 20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 520 30 L 520 20 L 510 20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 20 230 L 20 240 L 30 240" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 520 230 L 520 240 L 510 240" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  {/* JDK SOURCE LAYERS (LEFT) */}
  <g>
    <rect x="45" y="55" width="105" height="40" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="97.5" y="78" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7.5" font-family="JetBrains Mono, monospace">JAVA 8 BASE SOURCE</text>
  </g>
  <g>
    <rect x="45" y="110" width="105" height="40" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="97.5" y="133" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7.5" font-family="JetBrains Mono, monospace">JAVA 17 OVERRIDES</text>
  </g>
  <g>
    <rect x="45" y="165" width="105" height="40" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="97.5" y="188" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7.5" font-family="JetBrains Mono, monospace">JAVA 21 LOOM API</text>
  </g>

  {/* CONNECTORS LEFT -> CENTER */}
  <path d="M 150 75 L 205 130" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
  <path d="M 150 130 L 205 130" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
  <path d="M 150 185 L 205 130" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>

  {/* MAVEN PLUGIN ENGINE (CENTER) */}
  <rect x="205" y="55" width="150" height="150" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="280" y="80" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9" font-family="JetBrains Mono, monospace" font-weight="bold" letter-spacing="1">SOURCE OVERLAY CORE</text>
  <text x="280" y="93" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">Cascading Maven Plugin</text>

  <g><line x1="220" y1="115" x2="340" y2="115" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="115" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="118" fill="rgba(255,255,255,0.35)" font-size="6.5" font-family="JetBrains Mono, monospace">generate-sources Goal</text></g>
  <g><line x1="220" y1="135" x2="340" y2="135" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="135" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="138" fill="rgba(255,255,255,0.35)" font-size="6.5" font-family="JetBrains Mono, monospace">AST Overlay Merger</text></g>
  <g><line x1="220" y1="155" x2="340" y2="155" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="155" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="158" fill="rgba(255,255,255,0.35)" font-size="6.5" font-family="JetBrains Mono, monospace">Zero Code Duplication</text></g>
  <g><line x1="220" y1="175" x2="340" y2="175" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="175" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="178" fill="rgba(255,255,255,0.35)" font-size="6.5" font-family="JetBrains Mono, monospace">Multi-Target Compiler</text></g>

  {/* CONNECTOR CENTER -> RIGHT */}
  <path d="M 355 130 L 395 130" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>

  {/* OUTPUT ARTIFACT (RIGHT) */}
  <g>
    <rect x="395" y="90" width="105" height="80" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>
    <text x="447.5" y="125" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="8" font-family="JetBrains Mono, monospace">MR-JAR</text>
    <text x="447.5" y="140" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="6" font-family="JetBrains Mono, monospace">Multi-Release Target</text>
  </g>

  <text x="270" y="222" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="7" font-family="JetBrains Mono, monospace" letter-spacing="2">// CASCADING SOURCE OVERLAY MAVEN PLUGIN ENGINE</text>
</svg>
