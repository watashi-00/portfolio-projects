<svg viewBox="0 0 540 260" class="w-full h-full" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid-so-clean" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.4"/>
    </pattern>
  </defs>

  {/* Background Grid */}
  <rect width="540" height="260" fill="url(#grid-so-clean)"/>

  {/* Outer Frame */}
  <rect x="15" y="15" width="510" height="230" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

  {/* Corner Accents */}
  <g><line x1="11" y1="15" x2="19" y2="15" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/><line x1="15" y1="11" x2="15" y2="19" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/></g>
  <g><line x1="521" y1="15" x2="529" y2="15" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/><line x1="525" y1="11" x2="525" y2="19" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/></g>
  <g><line x1="11" y1="245" x2="19" y2="245" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/><line x1="15" y1="241" x2="15" y2="249" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/></g>
  <g><line x1="521" y1="245" x2="529" y2="245" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/><line x1="525" y1="241" x2="525" y2="249" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/></g>

  {/* SOURCE TREES (LEFT) */}
  <g>
    <rect x="35" y="50" width="110" height="38" rx="2" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.6"/>
    <circle cx="48" cy="69" r="3" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
    <text x="58" y="72" fill="rgba(255,255,255,0.3)" font-size="7" font-family="JetBrains Mono, monospace">src/main/java (base)</text>
  </g>
  <g>
    <rect x="35" y="105" width="110" height="38" rx="2" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.6"/>
    <circle cx="48" cy="124" r="3" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
    <text x="58" y="127" fill="rgba(255,255,255,0.3)" font-size="7" font-family="JetBrains Mono, monospace">src-java17 (overlay)</text>
  </g>
  <g>
    <rect x="35" y="160" width="110" height="38" rx="2" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.6"/>
    <circle cx="48" cy="179" r="3" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
    <text x="58" y="182" fill="rgba(255,255,255,0.3)" font-size="7" font-family="JetBrains Mono, monospace">src-java8 (override)</text>
  </g>

  {/* CONNECTORS TO ENGINE */}
  <path d="M 145 69 L 195 125" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>
  <path d="M 145 124 L 195 125" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.6" stroke-dasharray="3,3"/>
  <path d="M 145 179 L 195 125" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>

  {/* MAVEN PLUGIN ENGINE (CENTER) */}
  <rect x="195" y="50" width="150" height="150" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.25)" stroke-width="0.9"/>
  <text x="270" y="73" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="9.5" font-family="JetBrains Mono, monospace">MAVEN OVERLAY ENGINE</text>
  <text x="270" y="85" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="6.5" font-family="JetBrains Mono, monospace">generate-sources phase</text>

  {/* Engine Lifecycle steps */}
  <g><line x1="210" y1="105" x2="330" y2="105" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="222" cy="105" r="2" fill="rgba(255,255,255,0.3)"/><text x="232" y="108" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">Detect Target JDK Version</text></g>
  <g><line x1="210" y1="123" x2="330" y2="123" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="222" cy="123" r="2" fill="rgba(255,255,255,0.3)"/><text x="232" y="126" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">Copy Base Main Sources</text></g>
  <g><line x1="210" y1="141" x2="330" y2="141" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="222" cy="141" r="2" fill="rgba(255,255,255,0.3)"/><text x="232" y="144" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">Filter &amp; Sort Overlays</text></g>
  <g><line x1="210" y1="159" x2="330" y2="159" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="222" cy="159" r="2" fill="rgba(255,255,255,0.3)"/><text x="232" y="162" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">Cascading Source Merge</text></g>

  {/* ENGINE TO OUTPUT CONNECTORS */}
  <path d="M 345 100 L 395 80" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>
  <path d="M 345 150 L 395 160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>

  {/* TARGET OUTPUT (RIGHT) */}
  <g>
    <rect x="395" y="55" width="110" height="50" rx="2" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.6"/>
    <circle cx="410" cy="80" r="3" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
    <text x="420" y="78" fill="rgba(255,255,255,0.3)" font-size="7.5" font-family="JetBrains Mono, monospace">MERGED SOURCE</text>
    <text x="420" y="88" fill="rgba(255,255,255,0.18)" font-size="6" font-family="JetBrains Mono, monospace">target/generated-sources</text>
  </g>
  <g>
    <rect x="395" y="135" width="110" height="50" rx="2" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.6"/>
    <circle cx="410" cy="160" r="3" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
    <text x="420" y="158" fill="rgba(255,255,255,0.3)" font-size="7.5" font-family="JetBrains Mono, monospace">COMPILER STAGE</text>
    <text x="420" y="168" fill="rgba(255,255,255,0.18)" font-size="6" font-family="JetBrains Mono, monospace">javac / release bytecode</text>
  </g>

  {/* FOOTER DASHED BUS */}
  <line x1="45" y1="225" x2="495" y2="225" stroke="rgba(255,255,255,0.12)" stroke-width="0.6" stroke-dasharray="4,4"/>
  <text x="270" y="237" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="7.5" font-family="JetBrains Mono, monospace">MULTI-JDK CASCADING SOURCE OVERLAY BUILD PLUGIN</text>
</svg>
