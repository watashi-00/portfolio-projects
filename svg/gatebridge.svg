<svg viewBox="0 0 540 260" class="w-full h-full" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid-dots-gatebridge" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.5" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  {/* Background */}
  <rect width="540" height="260" fill="#020202"/>
  <rect width="540" height="260" fill="url(#grid-dots-gatebridge)"/>

  {/* Minimalist Border Frame & Corner Marks */}
  <rect x="20" y="20" width="500" height="220" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <path d="M 20 30 L 20 20 L 30 20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 520 30 L 520 20 L 510 20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 20 230 L 20 240 L 30 240" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 520 230 L 520 240 L 510 240" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  {/* INGRESS NODE (LEFT) */}
  <g>
    <rect x="45" y="70" width="100" height="120" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="95" y="94" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="8" font-family="JetBrains Mono, monospace" letter-spacing="1.5">INGRESS</text>
    
    <circle cx="95" cy="130" r="16" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
    <circle cx="95" cy="130" r="4" fill="rgba(255,255,255,0.8)"/>
    <line x1="95" y1="108" x2="95" y2="152" stroke="rgba(255,255,255,0.08)" stroke-width="0.6"/>
    <line x1="73" y1="130" x2="117" y2="130" stroke="rgba(255,255,255,0.08)" stroke-width="0.6"/>

    <text x="95" y="172" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="6.5" font-family="JetBrains Mono, monospace">PUB/SUB DISCOVERY</text>
  </g>

  {/* CONNECTING FLOW LEFT -> CENTER */}
  <path d="M 145 130 L 205 130" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <circle cx="175" cy="130" r="2" fill="rgba(255,255,255,0.6)"/>

  {/* GATEWAY CORE (CENTER) */}
  <g>
    <rect x="205" y="55" width="150" height="150" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="280" y="80" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9" font-family="JetBrains Mono, monospace" font-weight="bold" letter-spacing="1">GATEWAY CORE</text>
    <text x="280" y="93" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">Virtual Thread Pool</text>

    {/* Thread Channels */}
    <g>
      <line x1="225" y1="115" x2="335" y2="115" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>
      <circle cx="245" cy="115" r="2" fill="rgba(255,255,255,0.7)"/>
      <text x="340" y="117" fill="rgba(255,255,255,0.3)" font-size="6" font-family="JetBrains Mono, monospace">vt-1</text>
    </g>
    <g>
      <line x1="225" y1="135" x2="335" y2="135" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>
      <circle cx="275" cy="135" r="2" fill="rgba(255,255,255,0.7)"/>
      <text x="340" y="137" fill="rgba(255,255,255,0.3)" font-size="6" font-family="JetBrains Mono, monospace">vt-2</text>
    </g>
    <g>
      <line x1="225" y1="155" x2="335" y2="155" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>
      <circle cx="310" cy="155" r="2" fill="rgba(255,255,255,0.7)"/>
      <text x="340" y="157" fill="rgba(255,255,255,0.3)" font-size="6" font-family="JetBrains Mono, monospace">vt-3</text>
    </g>
    <g>
      <line x1="225" y1="175" x2="335" y2="175" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>
      <circle cx="330" cy="175" r="2" fill="rgba(255,255,255,0.7)"/>
      <text x="340" y="177" fill="rgba(255,255,255,0.3)" font-size="6" font-family="JetBrains Mono, monospace">vt-4</text>
    </g>
  </g>

  {/* CONNECTING FLOW CENTER -> RIGHT */}
  <path d="M 355 115 L 395 85" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.6"/>
  <path d="M 355 130 L 395 130" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
  <path d="M 355 175 L 395 175" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.6"/>

  {/* CLUSTER NODES (RIGHT) */}
  <g>
    <rect x="395" y="65" width="100" height="40" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <circle cx="412" cy="85" r="2.5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
    <text x="424" y="88" fill="rgba(255,255,255,0.5)" font-size="7" font-family="JetBrains Mono, monospace">NODE 01</text>
  </g>

  <g>
    <rect x="395" y="110" width="100" height="40" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <circle cx="412" cy="130" r="2.5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
    <text x="424" y="133" fill="rgba(255,255,255,0.5)" font-size="7" font-family="JetBrains Mono, monospace">NODE 02</text>
  </g>

  <g>
    <rect x="395" y="155" width="100" height="40" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <circle cx="412" cy="175" r="2.5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
    <text x="424" y="178" fill="rgba(255,255,255,0.5)" font-size="7" font-family="JetBrains Mono, monospace">NODE 03</text>
  </g>

  {/* Technical Footer Label */}
  <text x="270" y="222" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="7" font-family="JetBrains Mono, monospace" letter-spacing="2">// GATEBRIDGE HIGH-THROUGHPUT JAVA CLUSTER GATEWAY</text>
</svg>
