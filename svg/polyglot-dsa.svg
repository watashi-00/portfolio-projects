<svg viewBox="0 0 540 260" class="w-full h-full" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-dots-polyglot-dsa" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <marker id="arrow-polyglot-dsa" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="rgba(255,255,255,0.4)"/>
    </marker>
  </defs>

  <!-- LAYER 1: BACKGROUND & GRID -->
  <g class="layer-background">
    <rect width="540" height="260" fill="#020202"/>
    <rect width="540" height="260" fill="url(#grid-dots-polyglot-dsa)"/>
  </g>

  <!-- LAYER 2: SCHEMATIC FRAME & CORNER ACCENTS -->
  <g class="layer-frame">
    <rect x="20" y="20" width="500" height="220" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <path d="M 20 32 L 20 20 L 32 20" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>
    <path d="M 520 32 L 520 20 L 508 20" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>
    <path d="M 20 228 L 20 240 L 32 240" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>
    <path d="M 520 228 L 520 240 L 508 240" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>
  </g>

  <!-- LAYER 3: CONNECTIONS & BUS FLOW -->
  <g class="layer-connections">
    <path d="M 155 80 C 175 80, 175 105, 195 105" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.9" marker-end="url(#arrow-polyglot-dsa)"/>
    <path d="M 155 170 C 175 170, 175 145, 195 145" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.9" marker-end="url(#arrow-polyglot-dsa)"/>
    <path d="M 355 105 C 375 105, 375 80, 395 80" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.9" marker-end="url(#arrow-polyglot-dsa)"/>
    <path d="M 355 145 C 375 145, 375 170, 395 170" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.9" marker-end="url(#arrow-polyglot-dsa)"/>
  </g>

  <!-- LAYER 4: CONTAINERS & NODES -->
  <g class="layer-containers">
    <!-- Left Node 1 -->
    <rect x="45" y="58" width="110" height="44" rx="2" fill="#060606" stroke="rgba(255,255,255,0.14)" stroke-width="0.9"/>
    <text x="100" y="78" text-anchor="middle" fill="#dddddd" font-size="8.5" font-family="JetBrains Mono, monospace" font-weight="bold">ALGORITHM SUITE</text>
    <text x="100" y="90" text-anchor="middle" fill="#666666" font-size="7.2" font-family="JetBrains Mono, monospace">Graphs, Trees, Sorts</text>

    <!-- Left Node 2 -->
    <rect x="45" y="148" width="110" height="44" rx="2" fill="#060606" stroke="rgba(255,255,255,0.14)" stroke-width="0.9"/>
    <text x="100" y="168" text-anchor="middle" fill="#dddddd" font-size="8.5" font-family="JetBrains Mono, monospace" font-weight="bold">SYSTEM LANGUAGES</text>
    <text x="100" y="180" text-anchor="middle" fill="#666666" font-size="7.2" font-family="JetBrains Mono, monospace">C, C++, Java, Rust</text>
    <!-- CORE CONTAINER -->
    <rect x="195" y="52" width="160" height="150" rx="3" fill="#080808" stroke="rgba(255,255,255,0.3)" stroke-width="1.1"/>
    
    <!-- Active Status Indicator -->
    <circle cx="210" cy="67" r="2.5" fill="#40c463"/>
    <text x="218" y="69" fill="#888888" font-size="7" font-family="JetBrains Mono, monospace" letter-spacing="0.5">CORE RUNTIME</text>

    <!-- Level 1 Title & Subtitle -->
    <text x="275" y="86" text-anchor="middle" fill="#ffffff" font-size="11" font-family="JetBrains Mono, monospace" font-weight="bold" letter-spacing="0.8">POLYGLOT DSA CORE</text>
    <text x="275" y="98" text-anchor="middle" fill="#888888" font-size="7.5" font-family="JetBrains Mono, monospace">Multi-Language Library</text>

    <line x1="207" y1="106" x2="343" y2="106" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
    <!-- Core Item 1 -->
    <g>
      <circle cx="214" cy="118" r="1.5" fill="rgba(255,255,255,0.5)"/>
      <text x="222" y="120" fill="#bbbbbb" font-size="7.5" font-family="JetBrains Mono, monospace">Multi-Language Solutions</text>
    </g>
    <!-- Core Item 2 -->
    <g>
      <circle cx="214" cy="136" r="1.5" fill="rgba(255,255,255,0.5)"/>
      <text x="222" y="138" fill="#bbbbbb" font-size="7.5" font-family="JetBrains Mono, monospace">Unit Test Suites</text>
    </g>
    <!-- Core Item 3 -->
    <g>
      <circle cx="214" cy="154" r="1.5" fill="rgba(255,255,255,0.5)"/>
      <text x="222" y="156" fill="#bbbbbb" font-size="7.5" font-family="JetBrains Mono, monospace">Benchmark Harness</text>
    </g>
    <!-- Core Item 4 -->
    <g>
      <circle cx="214" cy="172" r="1.5" fill="rgba(255,255,255,0.5)"/>
      <text x="222" y="174" fill="#bbbbbb" font-size="7.5" font-family="JetBrains Mono, monospace">Clean Code Reference</text>
    </g>
    <!-- Right Node 1 -->
    <rect x="395" y="58" width="110" height="44" rx="2" fill="#060606" stroke="rgba(255,255,255,0.14)" stroke-width="0.9"/>
    <text x="450" y="78" text-anchor="middle" fill="#dddddd" font-size="8.5" font-family="JetBrains Mono, monospace" font-weight="bold">VERIFIED CODE</text>
    <text x="450" y="90" text-anchor="middle" fill="#666666" font-size="7.2" font-family="JetBrains Mono, monospace">Passed Test Suites</text>

    <!-- Right Node 2 -->
    <rect x="395" y="148" width="110" height="44" rx="2" fill="#060606" stroke="rgba(255,255,255,0.14)" stroke-width="0.9"/>
    <text x="450" y="168" text-anchor="middle" fill="#dddddd" font-size="8.5" font-family="JetBrains Mono, monospace" font-weight="bold">BENCHMARKS</text>
    <text x="450" y="180" text-anchor="middle" fill="#666666" font-size="7.2" font-family="JetBrains Mono, monospace">Performance Metrics</text>
  </g>

  <!-- LAYER 5: FOOTER ANNOTATION -->
  <g class="layer-footer">
    <text x="270" y="224" text-anchor="middle" fill="#444444" font-size="7.5" font-family="JetBrains Mono, monospace" letter-spacing="1.5">// ALGORITHM SPECIFICATIONS -> MULTI-LANGUAGE IMPL -> VERIFIED BENCHMARKS</text>
  </g>
</svg>
