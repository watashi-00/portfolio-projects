  <g><line x1="210" y1="128" x2="330" y2="128" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="222" cy="128" r="2" fill="rgba(255,255,255,0.3)"/><text x="232" y="131" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">Hardware Glyph Rasterizer</text></g>
  <g><line x1="210" y1="146" x2="330" y2="146" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="222" cy="146" r="2" fill="rgba(255,255,255,0.3)"/><text x="232" y="149" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">Sub-Millisecond Latency</text></g>
  <g><line x1="210" y1="164" x2="330" y2="164" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="222" cy="164" r="2" fill="rgba(255,255,255,0.3)"/><text x="232" y="167" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">Cross-Platform (Linux/Win)</text></g>

  <path d="M 345 100 L 395 80" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>
  <path d="M 345 160 L 395 180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>

