    <circle cx="410" cy="180" r="3" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
    <text x="420" y="178" fill="rgba(255,255,255,0.3)" font-size="7.5" font-family="JetBrains Mono, monospace">LOW LATENCY BUS</text>
    <text x="420" y="188" fill="rgba(255,255,255,0.18)" font-size="6" font-family="JetBrains Mono, monospace">Zero-Copy Rendering</text>
  </g>

  <line x1="45" y1="225" x2="495" y2="225" stroke="rgba(255,255,255,0.12)" stroke-width="0.6" stroke-dasharray="4,4"/>
  <text x="270" y="237" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="7.5" font-family="JetBrains Mono, monospace">NATIVE C GRAPHICS OVERLAY &amp; HUD RENDERER ENGINE</text>
