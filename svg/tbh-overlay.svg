    <circle cx="50" cy="130" r="3" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
    <text x="60" y="133" fill="rgba(255,255,255,0.3)" font-size="7.5" font-family="JetBrains Mono, monospace">DIRECT3D SWAP</text>
