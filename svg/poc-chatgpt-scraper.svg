  <g><line x1="220" y1="135" x2="340" y2="135" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="135" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="138" fill="rgba(255,255,255,0.35)" font-size="6.5" font-family="JetBrains Mono, monospace">DOM Input Injection</text></g>
  <g><line x1="220" y1="155" x2="340" y2="155" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="155" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="158" fill="rgba(255,255,255,0.35)" font-size="6.5" font-family="JetBrains Mono, monospace">Real-time Stream Scraper</text></g>
  <g><line x1="220" y1="175" x2="340" y2="175" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/><circle cx="230" cy="175" r="2" fill="rgba(255,255,255,0.7)"/><text x="240" y="178" fill="rgba(255,255,255,0.35)" font-size="6.5" font-family="JetBrains Mono, monospace">Multiplayer Room Sync</text></g>

  {/* CONNECTORS CENTER -> RIGHT */}
  <path d="M 355 100 L 395 80" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
  <path d="M 355 160 L 395 180" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>

  {/* CHATGPT LIVE SESSION (RIGHT) */}
  <g>
    <rect x="395" y="55" width="105" height="50" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="447.5" y="78" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="7.5" font-family="JetBrains Mono, monospace">HEADFUL CHROME</text>
    <text x="447.5" y="89" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="6" font-family="JetBrains Mono, monospace">Active CDP Session</text>
  </g>
  <g>
    <rect x="395" y="155" width="105" height="50" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="447.5" y="178" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="7.5" font-family="JetBrains Mono, monospace">CHATGPT DOM</text>
