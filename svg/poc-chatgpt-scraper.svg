  <path d="M 150 75 L 205 130" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
  <path d="M 150 130 L 205 130" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
  <path d="M 150 185 L 205 130" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>

