  <text x="280" y="80" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9" font-family="JetBrains Mono, monospace" font-weight="bold" letter-spacing="1">PUPPETEER CDP CORE</text>
  <text x="280" y="93" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">Chrome DevTools Protocol</text>

