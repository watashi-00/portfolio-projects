  </defs>

  <rect width="540" height="260" fill="#020202"/>
  <rect width="540" height="260" fill="url(#grid-dots-poc)"/>

  {/* Frame & Corner Accents */}
  <rect x="20" y="20" width="500" height="220" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <path d="M 20 30 L 20 20 L 30 20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 520 30 L 520 20 L 510 20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 20 230 L 20 240 L 30 240" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <path d="M 520 230 L 520 240 L 510 240" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  {/* MULTIPLAYER USERS (LEFT) */}
  <g>
    <rect x="45" y="55" width="105" height="40" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="97.5" y="78" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7.5" font-family="JetBrains Mono, monospace">CLIENT USER A</text>
  </g>
  <g>
    <rect x="45" y="110" width="105" height="40" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="97.5" y="133" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7.5" font-family="JetBrains Mono, monospace">CLIENT USER B</text>
  </g>
  <g>
    <rect x="45" y="165" width="105" height="40" rx="1" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="97.5" y="188" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="7.5" font-family="JetBrains Mono, monospace">WEBSOCKET BUS</text>
  </g>

