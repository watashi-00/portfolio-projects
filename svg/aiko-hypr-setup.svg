    <text x="60" y="132" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">[SH] Shell Automation</text>
    <text x="60" y="148" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">[UI] Wall-Sync Engine</text>
    <text x="60" y="164" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">[MOD] Widget Compiler</text>
  </g>

  <path d="M 150 125 L 205 125" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" stroke-dasharray="3,3"/>

