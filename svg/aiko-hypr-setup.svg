    <line x1="405" y1="102" x2="490" y2="102" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <text x="410" y="116" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">CPU / RAM Monitor</text>
    <text x="410" y="132" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">Media Player Bar</text>
    <text x="410" y="148" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">Network Status</text>
    <text x="410" y="164" fill="rgba(255,255,255,0.3)" font-size="6.5" font-family="JetBrains Mono, monospace">Notifications</text>
  </g>

  <text x="270" y="222" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="7" font-family="JetBrains Mono, monospace" letter-spacing="2">// AUTOMATED HYPRLAND DESKTOP ENVIRONMENT INSTALLER</text>
