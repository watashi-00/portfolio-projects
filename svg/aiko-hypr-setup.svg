  <text x="280" y="89" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="6.5" font-family="JetBrains Mono, monospace">Wayland Window Manager</text>

  {/* Tiling Window Wireframe accents */}
  <rect x="217" y="102" width="60" height="80" rx="1" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <text x="247" y="145" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="6" font-family="JetBrains Mono, monospace">WIN A</text>

  <rect x="283" y="102" width="60" height="37" rx="1" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <text x="313" y="124" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="6" font-family="JetBrains Mono, monospace">WIN B</text>

  <rect x="283" y="145" width="60" height="37" rx="1" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <text x="313" y="167" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="6" font-family="JetBrains Mono, monospace">WIN C</text>

  <path d="M 355 125 L 395 125" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" stroke-dasharray="3,3"/>

